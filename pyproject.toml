[project]
name = "order-chatbot-poc"
version = "0.1.0"
description = "Simple end-to-end customer service chatbot POC (order status)"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "boto3==1.35.36",
    "python-dotenv==1.0.1",
    "anthropic==0.39.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]